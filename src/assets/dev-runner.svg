<svg width="360" height="110" viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg">
  <rect width="360" height="110" fill="none"/>
  <!-- Manager with sword (left) -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="40" height="40" fill="#9f1239"/>
    <rect x="10" y="40" width="12" height="30" fill="#2563eb"/>
    <rect x="22" y="40" width="12" height="30" fill="#1d4ed8"/>
    <rect x="-8" y="16" width="12" height="14" fill="#fbbf24"/>
    <rect x="36" y="16" width="12" height="14" fill="#fbbf24"/>
    <rect x="6" y="-6" width="28" height="12" fill="#4c0519"/>
    <rect x="6" y="32" width="28" height="6" fill="#881337"/>
    <rect x="6" y="70" width="12" height="8" fill="#0f172a"/>
    <rect x="22" y="70" width="12" height="8" fill="#0f172a"/>
    <!-- sword -->
    <rect x="-30" y="20" width="26" height="6" fill="#e5e7eb"/>
    <rect x="-34" y="18" width="10" height="10" fill="#fde047" stroke="#92400e" stroke-width="2"/>
  </g>
  <!-- Developer with laptop (right) -->
  <g transform="translate(230,25)">
    <rect x="0" y="0" width="40" height="40" fill="#d97706"/>
    <rect x="10" y="40" width="12" height="30" fill="#1d4ed8"/>
    <rect x="22" y="40" width="12" height="30" fill="#2563eb"/>
    <rect x="-8" y="16" width="12" height="14" fill="#f59e0b"/>
    <rect x="36" y="16" width="12" height="14" fill="#f59e0b"/>
    <rect x="6" y="-6" width="28" height="12" fill="#7c2d12"/>
    <rect x="6" y="32" width="28" height="6" fill="#b45309"/>
    <rect x="6" y="70" width="12" height="8" fill="#1e293b"/>
    <rect x="22" y="70" width="12" height="8" fill="#1e293b"/>
    <!-- laptop -->
    <rect x="38" y="24" width="26" height="14" fill="#0ea5e9" stroke="#082f49" stroke-width="3"/>
    <rect x="24" y="42" width="26" height="6" fill="#0369a1"/>
  </g>
